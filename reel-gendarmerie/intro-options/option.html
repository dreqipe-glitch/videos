<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="../hf/assets/package.css">
<script src="../hf/assets/pkg.js"></script>
<script src="../hf/assets/bust.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05080F; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 46%, #0F1A2C 0%, #0B1320 45%, #05080F 100%); }
  .zel { position: absolute; inset: 0; opacity: 0.6; }
  .zel .pkg-zellige { opacity: 0.05; }
  .spot { position: absolute; left: 90px; top: 360px; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,149,165,0.22) 0%, rgba(255,149,165,0.08) 42%, rgba(255,149,165,0) 70%); }
  .bust { position: absolute; left: 220px; top: 470px; width: 640px; height: 704px;
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, #000 78%, transparent 100%); }
  .bust svg { width: 100%; height: 100%; display: block; }
  .q { position: absolute; left: 650px; top: 290px; width: 330px; height: 460px; transform: rotate(10deg); }
  .q .g { position: absolute; inset: 0; font-family: var(--font-ar); font-weight: 900; font-size: 400px; line-height: 460px; text-align: center; }
  .q .glow { color: #FF95A5; filter: blur(26px); opacity: 0.55; }
  .q .face { color: transparent; background: linear-gradient(165deg, #FFC4CD 0%, #FF95A5 45%, #E5677D 100%); -webkit-background-clip: text; background-clip: text; }
  .title { position: absolute; left: 90px; right: 90px; top: 1200px; text-align: center; direction: rtl; font-family: var(--font-ar); font-weight: 900; font-size: 166px; line-height: 200px; color: #F4F1EA; white-space: nowrap; }
  .title .p { color: #FF95A5; }
  .ul { position: absolute; left: 236px; width: 268px; top: 1407px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #E5677D, #FF95A5); }
  .acc { position: absolute; left: 450px; width: 180px; top: 1462px; height: 4px; display: flex; gap: 0; }
  .acc i { flex: 1; display: block; }
  .acc i:first-child { background: linear-gradient(90deg, rgba(193,39,45,0), #C1272D); }
  .acc i:last-child { background: linear-gradient(90deg, #1F9A5A, rgba(31,154,90,0)); }
  .grain { position: absolute; inset: 0; background-image: url("../hf/assets/grain.png"); background-size: 320px; opacity: 0.03; mix-blend-mode: screen; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(2,4,8,0.5) 100%); }
  /* duotone: the line-icon feel comes from a pink rim drawn around the silhouette */
  body.duo .bust svg { filter: drop-shadow(0 0 0 #FF95A5) drop-shadow(0 18px 40px rgba(0,0,0,0.5)); }
</style></head>
<body>
<div class="scene">
  <div class="bg"></div><div class="zel" id="zel"></div><div class="spot"></div>
  <div class="bust" id="bust"></div>
  <div class="q"><div class="g glow">؟</div><div class="g face">؟</div></div>
  <div class="title">سؤال <span class="p">اليوم</span></div>
  <div class="ul" id="ul"></div>
  <div class="acc"><i></i><i></i></div>
  <div class="vig"></div><div class="grain"></div>
</div>
<script>
  const style = new URLSearchParams(location.search).get("s") || "flat";
  document.body.className = style;
  document.getElementById("bust").innerHTML = Bust.svg(style, "b");
  document.getElementById("zel").innerHTML = '<svg class="pkg-zellige" style="left:0;top:0;width:1080px;height:1920px"></svg>';
  const z = document.createElement("div"); z.id = "zz-zelhost"; document.getElementById("zel").appendChild(z);
  // reuse the package zellige tile
  const tmp = document.createElement("div"); tmp.id = "o-zelhost"; document.body.appendChild(tmp);
  const fakeTl = { fromTo() {}, set() {}, to() {} };
  ["bg","cam","grain","in","out","flash"].forEach(n => { const d = document.createElement("div"); d.id = "o-" + n; d.style.display = "none"; document.body.appendChild(d); });
  Pkg.shell(fakeTl, "o", 1, { exit: false, entry: false });
  document.getElementById("zel").innerHTML = tmp.innerHTML; tmp.remove();
  // underline under «اليوم»: measure the pink word
  document.fonts.ready.then(() => {
    const p = document.querySelector(".title .p").getBoundingClientRect();
    Object.assign(document.getElementById("ul").style, { left: p.left + 8 + "px", width: p.width - 16 + "px" });
    document.body.dataset.ready = "1";
  });
</script>
</body></html>
