<!doctype html>
<html lang="ar" data-resolution="portrait"
  data-composition-variables='[{"id":"layer","type":"enum","label":"Layer","default":"all","options":[{"value":"all","label":"Preview: footage, captions, inserts"},{"value":"inserts","label":"Inserts only (delivery)"},{"value":"captions","label":"Captions only, transparent (delivery)"}]}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The whole reel: footage, captions, the three inserts and the original audio.
         Delivery renders set the "layer" variable: "inserts" (cut into insert_1/2/3) or "captions" (alpha overlay). -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/package.css" />
    <script src="assets/heroine.js"></script>
    <script src="assets/pkg.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05080F; }
      #root { width: 100%; height: 100%; position: relative; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
      #captions { z-index: 5; }
      #g1, #g2, #g3 { z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="79.4" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/media/reel.mp4" muted data-start="0" data-duration="79.4" data-track-index="0"></video>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="79.4" data-track-index="1" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <div id="g1" data-composition-id="g1" data-composition-src="compositions/g1.html" data-start="5.2333" data-duration="1.4333" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="g2" data-composition-id="g2" data-composition-src="compositions/g2.html" data-start="19.8666" data-duration="35.9333" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="g3" data-composition-id="g3" data-composition-src="compositions/g3.html" data-start="70.0333" data-duration="9.3667" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="vo" src="assets/media/vo.m4a" data-start="0" data-duration="79.4" data-track-index="4"></audio>
    </div>
    <script>
      // delivery layers: hide what the chosen layer leaves out (static, set once before any frame)
      const layer = ((window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}).layer || "all";
      const off = { inserts: ["footage", "captions"], captions: ["footage", "g1", "g2", "g3"] }[layer] || [];
      off.forEach((id) => (document.getElementById(id).style.opacity = "0"));
      if (layer === "captions") document.documentElement.style.background = document.body.style.background = "transparent";
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
