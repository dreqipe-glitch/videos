  <script>
    (function () {
      const { F, hrand } = Pkg;
      const tl = gsap.timeline({ paused: true });
      const DUR = F(29); // frames 0–28, then the footage
      // decorations (not timed elements): burst rays and light particles
      const rays = document.getElementById("t0-rays");
      for (let i = 0; i < 12; i++) {
        const w = document.createElement("div");
        w.className = "t0-ray";
        w.style.transform = `rotate(${i * 30 + 15}deg)`;
        w.innerHTML = `<div class="t0-rayl" id="t0-r${i}"></div>`;
        rays.appendChild(w);
      }
      const pts = document.getElementById("t0-pts");
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        const s = 5 + Math.round(hrand(i * 7 + 1) * 6);
        d.className = "t0-pt";
        d.id = "t0-p" + i;
        Object.assign(d.style, { width: s + "px", height: s + "px", left: 120 + Math.round(hrand(i * 13 + 3) * 820) + "px", top: 260 + Math.round(hrand(i * 5 + 9) * 1180) + "px" });
        pts.appendChild(d);
      }

      Pkg.shell(tl, "t0", DUR, { entry: false, push: [1.0, 1.05], exitFrames: 5 });

      gsap.set(["#t0-w1", "#t0-w2", "#t0-acc"], { opacity: 0 });
      gsap.set("#t0-ul", { scaleX: 0 });

      // F0–F5: the «؟» scales in with a pink flash, a ring burst and rays shooting out (frame 0 is already full)
      tl.fromTo("#t0-flash", { opacity: 0.38 }, { opacity: 0, duration: F(5), ease: "power2.out" }, 0);
      tl.fromTo("#t0-q", { scale: 1.4, y: 0 }, { scale: 1, duration: F(5), ease: "back.out(2)" }, 0);
      tl.fromTo("#t0-glow", { scale: 0.8, opacity: 0.6 }, { scale: 1, opacity: 1, duration: F(6), ease: "expo.out" }, 0);
      tl.fromTo("#t0-ring", { scale: 0.72, opacity: 0.5 }, { scale: 1, opacity: 1, duration: F(6), ease: "back.out(2)" }, 0);
      tl.fromTo("#t0-ringb", { scale: 0.85, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: F(10), ease: "expo.out" }, 0);
      for (let i = 0; i < 12; i++) {
        tl.fromTo("#t0-r" + i, { x: -40, scaleX: 0.2, opacity: 1 }, { x: 40 + (i % 3) * 14, scaleX: 1, duration: F(6), ease: "expo.out" }, F(1 + (i % 2)));
        tl.to("#t0-r" + i, { x: 90 + (i % 3) * 14, opacity: 0.45, duration: F(20), ease: "sine.out" }, F(7 + (i % 2)));
      }

      // «سؤال» (spoken 0.08–0.38 s): slam lands on frame 5, tiny shake
      tl.fromTo("#t0-w1", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: F(4), ease: "back.out(2.4)" }, F(1));
      [3, -2, 0].forEach((d, i) => tl.to("#t0-shake", { x: d, y: -d * 0.6, duration: F(1), ease: "none" }, F(5 + i)));
      // «اليوم» (spoken 0.48–0.76 s): slam lands on frame 17, shake, underline sweep
      tl.fromTo("#t0-w2", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: F(4), ease: "back.out(2.4)" }, F(13));
      [3, -2, 0].forEach((d, i) => tl.to("#t0-shake", { x: d, y: -d * 0.6, duration: F(1), ease: "none" }, F(17 + i)));
      tl.to("#t0-ul", { scaleX: 1, duration: F(6), ease: "expo.out" }, F(16));

      // F14–F22: the Moroccan accent glides in; the «؟» floats
      tl.fromTo("#t0-acc", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: F(8), ease: "expo.out" }, F(14));
      tl.fromTo(["#t0-lnr", "#t0-lng"], { scaleX: 0 }, { scaleX: 1, duration: F(8), ease: "expo.out" }, F(15));
      tl.to("#t0-q", { y: -14, duration: F(22), ease: "sine.inOut" }, F(6));

      // F18–F22: a white/pink light sweep across «سؤال اليوم»
      tl.set(["#t0-s1", "#t0-s2"], { opacity: 1 }, F(18));
      tl.fromTo(["#t0-s1", "#t0-s2"], { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: F(5), ease: "power2.inOut", immediateRender: false }, F(18));
      tl.set(["#t0-s1", "#t0-s2"], { opacity: 0 }, F(23));

      // light particles drift up through the whole intro
      for (let i = 0; i < 16; i++)
        tl.fromTo("#t0-p" + i, { y: 0, opacity: 0.25 + hrand(i * 3) * 0.5 }, { y: -(40 + hrand(i * 11) * 70), opacity: 0.15 + hrand(i * 17) * 0.6, duration: DUR, ease: "none" }, 0);

      window.__timelines["t0"] = tl;
    })();
