<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"HyperFrames"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":"5-second render test · 1080p60"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Brand tokens — keep in sync with brand.json at the repo root. */
      :root {
        --ground: #0b1020;
        --ink: #f5f7ff;
        --muted: #9aa3c7;
        --accent: #ff5a36;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #captions {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 140px;
        display: flex;
        justify-content: center;
      }
      #caption-text {
        padding: 14px 28px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.6);
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 40px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="title"
        class="clip"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
      <div id="captions" class="clip" data-start="0.6" data-duration="4.2" data-track-index="1" data-track-kind="captions">
        <span id="caption-text">This is a HyperFrames test render.</span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#caption-text", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
      tl.fromTo("#caption-text", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
